version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
  # requirements/requirements-dev.in, the pinned development dependencies, and requirements/requirements-mutation.in,
  # the mutation gate's tools, with the hash-locked requirements/requirements-dev.txt and
  # requirements/requirements-mutation.txt that pip-compile builds from them, each compiled from that folder.
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-dev:
        patterns: ["*"]
      python-dev-security:
        applies-to: security-updates
        patterns: ["*"]
