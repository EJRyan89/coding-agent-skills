version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
  # requirements-dev.in, the pinned development dependencies, and requirements-mutation.in, the mutation gate's tools,
  # with the hash-locked requirements-dev.txt and requirements-mutation.txt that pip-compile builds from them.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-dev:
        patterns: ["*"]
      python-dev-security:
        applies-to: security-updates
        patterns: ["*"]
