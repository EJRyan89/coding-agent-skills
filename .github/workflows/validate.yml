name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Validation compares with the base branch to find documentation-only changes; without its history it
          # cannot tell and runs every suite.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install validation tools
        shell: pwsh
        run: |
          choco install shellcheck --version 0.9.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify validation tools
        shell: pwsh
        run: |
          foreach ($command in 'python.exe', 'shellcheck.exe') {
            $resolved = Get-Command $command -ErrorAction Stop
            Write-Host "$command -> $($resolved.Source)"
          }

      - name: Run repository validation
        shell: pwsh
        run: python -B tests/run_validation.py -v

