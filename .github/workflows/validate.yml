name: Validation

on:
  # `edited` reruns validation when the body or the title changes, since the upgrade-notes check reads the body's
  # `## Upgrade note` and the title check the title.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  # Weekly, so a change to the runner image or a new ShellCheck release surfaces without waiting for a pull request.
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# The validation tools' pins, which docs/dependency-updates.md owns: the install commands and the cache keys read them
# here, so a raised pin installs and caches the new release together.
env:
  SHELLCHECK_VERSION: '0.9.0'
  PSSCRIPTANALYZER_VERSION: '1.25.0'
  # The digest of ShellCheck's Linux release archive at the pin, which the Linux legs check before extracting it.
  SHELLCHECK_LINUX_SHA256: '700324c6dd0ebea0117591c6cc9d7350d9c7c5c287acbad7630fa17b1d4d9e2f'

# A newer push to a pull request cancels its older run; every commit on main keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  suite:
    # The name says Windows beside the Linux job; tools/record_job_seconds.py reads each leg's shard from it.
    name: Windows shard ${{ matrix.shard }}, Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The floor in deployer/tools.py on every run. The latest stable release runs on the weekly schedule only, so
        # a new interpreter is a signal there and never blocks a pull request through the required `Validation` check.
        python-version: ${{ github.event_name == 'schedule' && fromJSON('["3.11", "3.x"]') || fromJSON('["3.11"]') }}
        # One run's jobs dealt across six runners, so a leg's four cores run a sixth of them; each interpreter runs
        # every leg. The count is the second number of each entry.
        shard: ['1/6', '2/6', '3/6', '4/6', '5/6', '6/6']

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Validation compares with the base branch to find documentation-only changes; without its history it
          # cannot tell and runs every suite.
          fetch-depth: 0

      # Real-time scanning was off on every leg, so it does not cause the file-heavy suites' slowness here. The reading
      # costs seconds, so the weekly run alone shows whether the image has turned it on; a pull request does not wait.
      - name: Show Defender's real-time protection state
        if: github.event_name == 'schedule'
        shell: pwsh
        run: |
          $enabled = (Get-MpComputerStatus -ErrorAction Stop).RealTimeProtectionEnabled
          Write-Host "Defender real-time protection enabled: $enabled"

      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Each type check keeps mypy's cache in a folder of its own under this one, so the standard library's stubs are
      # parsed once per leg, Python, and mypy pin rather than at every run; the leg's index keys it, since each leg's
      # deal runs its own type checks.
      - name: Restore mypy's cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mypy-cache
          key: mypy-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ strategy.job-index }}-${{ hashFiles('requirements-dev.txt') }}

      # Each leg installs the same tools, so a leg after the first restores them; a raised pin changes the key.
      - name: Restore ShellCheck
        id: shellcheck
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\shellcheck
          key: shellcheck-${{ runner.os }}-${{ env.SHELLCHECK_VERSION }}

      - name: Restore PSScriptAnalyzer
        id: psscriptanalyzer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\Documents\PowerShell\Modules\PSScriptAnalyzer
          key: psscriptanalyzer-${{ runner.os }}-${{ env.PSSCRIPTANALYZER_VERSION }}

      - name: Install validation tools
        shell: pwsh
        env:
          SHELLCHECK_CACHED: ${{ steps.shellcheck.outputs.cache-hit }}
          PSSCRIPTANALYZER_CACHED: ${{ steps.psscriptanalyzer.outputs.cache-hit }}
        run: |
          # ShellCheck is one executable, kept in its own folder ahead of everything else on PATH.
          $shellcheck = Join-Path $env:RUNNER_TEMP 'shellcheck'
          if ($env:SHELLCHECK_CACHED -ne 'true') {
            choco install shellcheck --version $env:SHELLCHECK_VERSION --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $installed = Get-ChildItem (Join-Path $env:ChocolateyInstall 'lib\shellcheck') -Recurse -Filter shellcheck.exe
            New-Item -ItemType Directory -Path $shellcheck -Force | Out-Null
            Copy-Item -LiteralPath ($installed | Select-Object -First 1).FullName -Destination $shellcheck -ErrorAction Stop
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $shellcheck
          if ($env:PSSCRIPTANALYZER_CACHED -ne 'true') {
            Install-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Scope CurrentUser -Force -ErrorAction Stop
          }

      # ruff, mypy, pytest, and every package they need, at the hashes of their lock, which
      # docs/dependency-updates.md owns and Dependabot reviews.
      - name: Install development dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify validation tools
        shell: pwsh
        run: |
          # Git Bash by its path: a bare `bash` can resolve to WSL's.
          $gitBash = Join-Path $env:ProgramFiles 'Git\bin\bash.exe'
          foreach ($command in @('python', $gitBash, 'pwsh', 'shellcheck')) {
            $resolved = Get-Command $command -ErrorAction Stop
            Write-Host "$command -> $($resolved.Source)"
            & $resolved.Source --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python -m ruff --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m mypy --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Validation runs the first ShellCheck on PATH and the newest installed PSScriptAnalyzer: each is the pin.
          $shellcheck = [string]((shellcheck --version) -match '^version: ' -replace '^version: ')
          if ($shellcheck -ne $env:SHELLCHECK_VERSION) { throw "ShellCheck is '$shellcheck', not the pin $env:SHELLCHECK_VERSION" }
          $analyzer = [string](Get-Module -ListAvailable PSScriptAnalyzer | Sort-Object Version -Descending | Select-Object -First 1).Version
          if ($analyzer -ne $env:PSSCRIPTANALYZER_VERSION) { throw "PSScriptAnalyzer is '$analyzer', not the pin $env:PSSCRIPTANALYZER_VERSION" }
          Write-Host "ShellCheck $shellcheck; PSScriptAnalyzer $analyzer"

      # The gallery is not a Dependabot ecosystem, so the weekly run shows when the pin has fallen behind; a pull request
      # does not wait on the query.
      - name: Show the latest PSScriptAnalyzer release
        if: github.event_name == 'schedule'
        shell: pwsh
        run: |
          Write-Host "PSScriptAnalyzer latest release: $((Find-Module PSScriptAnalyzer -ErrorAction Stop).Version)"

      - name: Run repository validation
        shell: pwsh
        env:
          SHARD: ${{ matrix.shard }}
          VALIDATION_MYPY_CACHE: ${{ runner.temp }}/mypy-cache
        run: |
          # Outside a pull request there is no base to compare with, so run every suite.
          $arguments = @('-B', 'tests/run_validation.py', '-v', '--shard', $env:SHARD)
          if ($env:GITHUB_EVENT_NAME -ne 'pull_request') { $arguments += '--full' }
          else {
            # The body and the title are the author's text, so each goes from the event payload to a file the
            # upgrade-notes and title checks read, never through an expression into this script.
            $payload = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw -Encoding utf8 | ConvertFrom-Json
            $bodyFile = Join-Path $env:RUNNER_TEMP 'pull-request-body.md'
            [System.IO.File]::WriteAllText($bodyFile, [string]$payload.pull_request.body)
            $arguments += @('--pr-body', $bodyFile)
            $titleFile = Join-Path $env:RUNNER_TEMP 'pull-request-title.txt'
            [System.IO.File]::WriteAllText($titleFile, [string]$payload.pull_request.title)
            $arguments += @('--pr-title', $titleFile)
          }
          python @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The pin above is the floor; this exercises the newest release, whose new warnings would stop deployments.
      - name: Validate with the latest ShellCheck
        if: github.event_name == 'schedule' && matrix.python-version == '3.x'
        shell: pwsh
        env:
          SHARD: ${{ matrix.shard }}
          VALIDATION_MYPY_CACHE: ${{ runner.temp }}/mypy-cache
        run: |
          choco upgrade shellcheck --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Chocolatey's release ahead of the pinned one, which the install step put first on PATH.
          $env:PATH = "$(Join-Path $env:ChocolateyInstall 'bin');$env:PATH"
          shellcheck --version
          python -B tests/run_validation.py --full -v --shard $env:SHARD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # The whole validation run on Linux, dealt across its own legs by Linux's seconds as the Windows legs are by
  # Windows'. The `validate` job needs it as it needs the Windows legs, so a red Linux leg fails the required check.
  linux:
    # Named as the Windows legs are, with the Python setup-python installs, read from the matrix, so the name cannot
    # say another; tools/record_job_seconds.py reads each Linux leg's shard from the name.
    name: Linux shard ${{ matrix.shard }}, Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The floor in deployer/tools.py.
        python-version: ['3.11']
        # One run's jobs dealt across two runners. The count is the second number of each entry.
        shard: ['1/2', '2/2']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # As on the Windows legs: the base branch tells a documentation-only change, and the tags the upgrade notes.
          fetch-depth: 0

      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Each type check keeps mypy's cache in a folder of its own under this one, so the standard library's stubs are
      # parsed once per leg, Python, and mypy pin rather than at every run; the leg's index keys it, since each leg's
      # deal runs its own type checks.
      - name: Restore mypy's cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mypy-cache
          key: mypy-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ strategy.job-index }}-${{ hashFiles('requirements-dev.txt') }}

      # As on the Windows legs, a leg after the first restores the pinned tools; a raised pin changes the key.
      - name: Restore ShellCheck
        id: shellcheck
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/shellcheck
          key: shellcheck-${{ runner.os }}-${{ env.SHELLCHECK_VERSION }}

      # The image ships PSScriptAnalyzer for all users, and Install-Module of a version already in use installs
      # nothing, so the cache and the install run only when the image lacks the pin. The verify step checks the result
      # either way.
      - name: Find the pinned PSScriptAnalyzer on the image
        id: psscriptanalyzer-image
        shell: pwsh
        run: |
          $found = @(Get-Module -ListAvailable PSScriptAnalyzer | Where-Object { [string]$_.Version -eq $env:PSSCRIPTANALYZER_VERSION })
          Write-Host "PSScriptAnalyzer $env:PSSCRIPTANALYZER_VERSION on the image: $($found.Count -gt 0)"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "installed=$(([string]($found.Count -gt 0)).ToLowerInvariant())"

      - name: Restore PSScriptAnalyzer
        id: psscriptanalyzer
        if: steps.psscriptanalyzer-image.outputs.installed != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/powershell/Modules/PSScriptAnalyzer
          key: psscriptanalyzer-${{ runner.os }}-${{ env.PSSCRIPTANALYZER_VERSION }}

      # The image has Bash and PowerShell 7. ShellCheck is the pinned release's own Linux build, checked against its
      # pinned digest and kept in its own folder ahead of the image's on PATH.
      - name: Install ShellCheck
        shell: bash
        env:
          SHELLCHECK_CACHED: ${{ steps.shellcheck.outputs.cache-hit }}
        run: |
          shellcheck="$RUNNER_TEMP/shellcheck"
          if [ "$SHELLCHECK_CACHED" != true ]; then
            release="https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION"
            archive="$RUNNER_TEMP/shellcheck.tar.xz"
            curl --fail --silent --show-error --location --retry 3 --output "$archive" "$release/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
            echo "$SHELLCHECK_LINUX_SHA256  $archive" | sha256sum --check --strict
            mkdir -p "$shellcheck"
            tar --extract --xz --file "$archive" --directory "$shellcheck" --strip-components 1 "shellcheck-v$SHELLCHECK_VERSION/shellcheck"
          fi
          echo "$shellcheck" >> "$GITHUB_PATH"

      - name: Install PSScriptAnalyzer
        if: steps.psscriptanalyzer-image.outputs.installed != 'true' && steps.psscriptanalyzer.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Scope CurrentUser -Force -ErrorAction Stop

      - name: Install development dependencies
        shell: bash
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements-dev.txt

      - name: Verify validation tools
        shell: pwsh
        run: |
          foreach ($command in @('python', 'bash', 'pwsh', 'shellcheck')) {
            $resolved = Get-Command $command -ErrorAction Stop
            Write-Host "$command -> $($resolved.Source)"
            & $resolved.Source --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python -m ruff --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m mypy --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Validation runs the first ShellCheck on PATH and the newest installed PSScriptAnalyzer: each is the pin.
          $shellcheck = [string]((shellcheck --version) -match '^version: ' -replace '^version: ')
          if ($shellcheck -ne $env:SHELLCHECK_VERSION) { throw "ShellCheck is '$shellcheck', not the pin $env:SHELLCHECK_VERSION" }
          $analyzer = [string](Get-Module -ListAvailable PSScriptAnalyzer | Sort-Object Version -Descending | Select-Object -First 1).Version
          if ($analyzer -ne $env:PSSCRIPTANALYZER_VERSION) { throw "PSScriptAnalyzer is '$analyzer', not the pin $env:PSSCRIPTANALYZER_VERSION" }
          Write-Host "ShellCheck $shellcheck; PSScriptAnalyzer $analyzer"

      - name: Run repository validation
        shell: pwsh
        env:
          SHARD: ${{ matrix.shard }}
          VALIDATION_MYPY_CACHE: ${{ runner.temp }}/mypy-cache
          # More workers than the runner's four vCPUs, since most Linux jobs wait on Git and other processes: it cut the
          # legs' summed seconds by about a fifth with no retry or timeout, where the Windows legs gained nothing.
          VALIDATION_JOBS: '6'
        run: |
          # The Windows legs' step: outside a pull request there is no base to compare with, so every suite runs, and
          # a pull request's body and title reach the checks as files written from the event payload.
          $arguments = @('-B', 'tests/run_validation.py', '-v', '--shard', $env:SHARD)
          if ($env:GITHUB_EVENT_NAME -ne 'pull_request') { $arguments += '--full' }
          else {
            $payload = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw -Encoding utf8 | ConvertFrom-Json
            $bodyFile = Join-Path $env:RUNNER_TEMP 'pull-request-body.md'
            [System.IO.File]::WriteAllText($bodyFile, [string]$payload.pull_request.body)
            $arguments += @('--pr-body', $bodyFile)
            $titleFile = Join-Path $env:RUNNER_TEMP 'pull-request-title.txt'
            [System.IO.File]::WriteAllText($titleFile, [string]$payload.pull_request.title)
            $arguments += @('--pr-title', $titleFile)
          }
          python @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Branch protection requires the single check named `Validation`, this job's name, so every leg on each platform
  # reports through this job: a matrix job's result is success only when every one of its legs succeeded. It runs
  # when a leg fails, since a skipped required check would count as passing.
  validate:
    name: Validation
    if: ${{ !cancelled() }}
    needs: [suite, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every leg to pass
        env:
          WINDOWS: ${{ needs.suite.result }}
          LINUX: ${{ needs.linux.result }}
        run: |
          echo "Windows legs: $WINDOWS; Linux legs: $LINUX"
          test "$WINDOWS" = success
          test "$LINUX" = success
