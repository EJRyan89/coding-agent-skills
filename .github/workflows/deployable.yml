name: Deployment Smoke Test

# A signal, never a gate: dispatch it before a release or after a deployer change (docs/releasing.md). It also runs
# weekly, the day after validate.yml's weekly run, once on the README's versions and once on the latest release of
# every runtime, so a runtime release that breaks a fresh install shows within a week. Each job starts from a fresh
# GitHub-hosted runner, Windows in one and Ubuntu in the other, installs the prerequisites and the three runtimes,
# deploys into the runner's real profile, asks Codex CLI and Copilot CLI whether they find every runtime adapter,
# uninstalls, and deploys again. It
# does not start a model, so it does not show a skill running; the runtime canary does that. Claude Code reads the
# deployed files directly and cannot list skills without a session, so for it the check is the installed version and
# the file layout, not discovery. It needs no secret and no sign-in. If a runtime refuses to list skills until it is
# signed in, that runtime is reported SKIPPED with the reason, and the job fails only when no runtime could be checked.
#
# It deploys into the real profile, not --canary-home: Codex on Windows reads personal skills from the profile whatever
# HOME says, so only a deployment there can be discovery-checked, and a fresh runner's profile is already clean. The
# Linux job deploys into HOME, the profile every runtime reads there, for the same reason.

on:
  workflow_dispatch:
    inputs:
      claude-version:
        description: Claude Code version to install from npm, or latest. The default is the README's tested version.
        type: string
        default: '2.1.302'
      codex-version:
        description: Codex CLI version to install from npm, or latest. The default is the README's tested version.
        type: string
        default: '0.163.0'
      copilot-version:
        description: GitHub Copilot CLI version to install from npm, or latest. The default is the README's tested version.
        type: string
        default: '1.0.98'
  schedule:
    - cron: '23 6 * * 2'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deployable:
    name: Deploy to a fresh Windows profile (${{ matrix.runtimes }} runtimes)
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # A dispatch runs the versions it was given. A scheduled run has no inputs, so it runs the README's versions,
        # the inputs' defaults, and beside them the latest release of every runtime.
        runtimes: ${{ github.event_name == 'schedule' && fromJSON('["readme", "latest"]') || fromJSON('["requested"]') }}
    env:
      CLAUDE_VERSION: ${{ matrix.runtimes == 'latest' && 'latest' || inputs.claude-version || '2.1.302' }}
      CODEX_VERSION: ${{ matrix.runtimes == 'latest' && 'latest' || inputs.codex-version || '0.163.0' }}
      COPILOT_VERSION: ${{ matrix.runtimes == 'latest' && 'latest' || inputs.copilot-version || '1.0.98' }}
      # Copilot CLI otherwise runs the newest package it has downloaded, not the one installed and checked here.
      COPILOT_AUTO_UPDATE: 'false'
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare the run record
        run: |
          $logs = Join-Path $env:RUNNER_TEMP 'deployable-logs'
          New-Item -ItemType Directory -Force $logs | Out-Null
          "LOGS=$logs" | Add-Content -Path $env:GITHUB_ENV
          "RESULTS=$(Join-Path $logs 'results.json')" | Add-Content -Path $env:GITHUB_ENV
          "NOTES=$(Join-Path $logs 'notes.txt')" | Add-Content -Path $env:GITHUB_ENV

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The floor in deployer/tools.py.
          python-version: '3.11'

      # Copilot CLI needs Node.js 22 or newer.
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # The install commands are the ones docs/installation.md lists. The runner image already provides some of these
      # tools, so each is installed only when it is missing; the verify step below records what was found.
      - name: Install the prerequisites
        run: |
          $installed = $false
          foreach ($package in @(@('git', 'git'), @('pwsh', 'pwsh'), @('gh', 'gh'), @('shellcheck', 'shellcheck'))) {
            $command, $name = $package
            if (Get-Command $command -ErrorAction SilentlyContinue) {
              Write-Host "$command is provided by the runner image"
              continue
            }
            choco install $name --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $installed = $true
          }
          if ($installed) {
            # Later steps start with the PATH the runner had, so hand them the directories the installers added.
            $current = $env:PATH -split ';'
            foreach ($directory in ([Environment]::GetEnvironmentVariable('Path', 'Machine') -split ';')) {
              if ($directory -and ($current -notcontains $directory)) { Add-Content -Path $env:GITHUB_PATH -Value $directory }
            }
          }

      - name: Install Claude Code, Codex CLI, and GitHub Copilot CLI
        run: |
          npm install --global "@anthropic-ai/claude-code@$env:CLAUDE_VERSION" "@openai/codex@$env:CODEX_VERSION" "@github/copilot@$env:COPILOT_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Later steps start with the PATH the runner had, so hand them npm's global directory.
          npm prefix --global | Add-Content -Path $env:GITHUB_PATH

      # A new step is a new shell with the PATH a person would see after opening a terminal.
      - name: Verify the tools in a fresh shell
        run: |
          foreach ($command in @('python', 'git', 'pwsh', 'shellcheck', 'gh', 'node', 'npm', 'claude', 'codex', 'copilot')) {
            $resolved = Get-Command $command -ErrorAction Stop | Select-Object -First 1
            Write-Host "$command -> $($resolved.Source)"
          }
          foreach ($pin in @(@('claude', $env:CLAUDE_VERSION), @('codex', $env:CODEX_VERSION), @('copilot', $env:COPILOT_VERSION))) {
            $command, $wanted = $pin
            $reported = (& $command --version | Out-String).Trim()
            Write-Host "$command --version: $reported"
            if ($wanted -ne 'latest' -and $reported -notmatch [regex]::Escape($wanted)) {
              Write-Host "::error::$command reports '$reported', not the requested version $wanted"
              exit 1
            }
          }

      # Codex CLI on Windows needs two machine settings before it can run a skill's scripts (docs/codex-support.md).
      # Neither changes what `verify` sees, because discovery runs no script. This step writes the sandbox setting, so
      # the runner is configured as a user's machine must be, though not provisioned: the elevated sandbox's
      # administrator-approved setup never runs here, since nothing here runs a command in the sandbox. It also records
      # where the Python app execution aliases stand, since no supported command turns them off.
      - name: Make the Codex sandbox setting and record the Python aliases
        run: |
          $directory = Join-Path $env:USERPROFILE '.codex'
          New-Item -ItemType Directory -Force $directory | Out-Null
          $config = Join-Path $directory 'config.toml'
          if (Test-Path -LiteralPath $config) {
            Write-Host "::error::$config already exists on a runner that should be fresh"
            exit 1
          }
          Set-Content -LiteralPath $config -Value "[windows]`nsandbox = `"elevated`"" -Encoding utf8NoBOM
          Add-Content -Path $env:NOTES -Value 'Codex sandbox: wrote [windows] sandbox = "elevated" to ~/.codex/config.toml.'

          # The documented check that needs no model: the mode Codex would use.
          $probe = (codex debug prompt-input -c sandbox_mode=workspace-write 2>&1 | Out-String)
          $mode = [regex]::Match($probe, 'sandbox_mode` is `([a-z-]+)')
          if ($mode.Success -and $mode.Groups[1].Value -eq 'workspace-write') {
            Add-Content -Path $env:NOTES -Value 'Codex sandbox: codex debug prompt-input reports workspace-write, so the setting is read.'
          } else {
            Write-Host '::warning::Codex did not report workspace-write; the sandbox setting is unconfirmed.'
            Add-Content -Path $env:NOTES -Value 'Codex sandbox: unconfirmed, codex debug prompt-input did not report workspace-write.'
          }

          # The python.exe and python3.exe app execution aliases can only be turned off in Settings, which has no
          # supported command, so record where they stand instead.
          $aliases = @(Get-ChildItem -Path (Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps') -Filter 'python*.exe' -ErrorAction SilentlyContinue)
          $first = (Get-Command python -All | Select-Object -First 1).Source
          Add-Content -Path $env:NOTES -Value "Python aliases: $($aliases.Count) python*.exe app execution alias(es) in WindowsApps, not turned off (Settings has no supported command); python resolves first to $first."
          if ($first -like '*\WindowsApps\*') {
            Write-Host '::warning::python resolves to a WindowsApps alias, which Codex CLI cannot start.'
          }

      - name: Check the deployer's prerequisites
        run: |
          python deploy.py check 2>&1 | Tee-Object -FilePath (Join-Path $env:LOGS 'check.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # configure reads its answers from stdin, so piping them exercises the prompts a person uses: the repositories
      # directory, then an empty line for each later prompt, which keeps its default. Validation holds the answers to
      # the prompts deployer/config.py declares.
      - name: Configure
        run: |
          $repositories = Join-Path $env:USERPROFILE 'GitHub'
          New-Item -ItemType Directory -Force $repositories | Out-Null
          $repositories, '', '', '' | python deploy.py configure 2>&1 | Tee-Object -FilePath (Join-Path $env:LOGS 'configure.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy (dry run, then for real)
        run: |
          python deploy.py --all --dry-run 2>&1 | Tee-Object -FilePath (Join-Path $env:LOGS 'dry-run.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python deploy.py --all 2>&1 | Tee-Object -FilePath (Join-Path $env:LOGS 'deploy.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify discovery after the first deployment
        run: |
          python deploy.py verify 2>&1 | Tee-Object -FilePath (Join-Path $env:LOGS 'verify-first.log')
          $deployVerify = $LASTEXITCODE
          python tools/deployable_report.py verify --label 'first deploy' --deploy-verify-exit $deployVerify --deploy-verify-log (Join-Path $env:LOGS 'verify-first.log') --results $env:RESULTS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Claude Code has no skill listing and no adapter, so check its files instead; no session is started.
      - name: Check the Claude Code file layout after the first deployment
        run: |
          python tools/deployable_report.py layout --label 'first deploy' --results $env:RESULTS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The README's uninstall, which selects nothing and shows no prompt.
      - name: Uninstall
        run: |
          python deploy.py --uninstall --dry-run 2>&1 | Tee-Object -FilePath (Join-Path $env:LOGS 'uninstall-dry-run.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python deploy.py --uninstall 2>&1 | Tee-Object -FilePath (Join-Path $env:LOGS 'uninstall.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Names each entry left where items deploy, files included, and each item the manifest still records, beside the
      # manifest and retained backups the uninstall keeps; the step summary lists them.
      - name: Confirm the profile holds nothing from the suite
        run: |
          python tools/deployable_report.py leftovers --results $env:RESULTS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy again
        run: |
          python deploy.py --all 2>&1 | Tee-Object -FilePath (Join-Path $env:LOGS 'redeploy.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify discovery after the second deployment
        run: |
          python deploy.py verify 2>&1 | Tee-Object -FilePath (Join-Path $env:LOGS 'verify-second.log')
          $deployVerify = $LASTEXITCODE
          python tools/deployable_report.py verify --label 'after uninstall and redeploy' --deploy-verify-exit $deployVerify --deploy-verify-log (Join-Path $env:LOGS 'verify-second.log') --results $env:RESULTS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the Claude Code file layout after the second deployment
        run: |
          python tools/deployable_report.py layout --label 'after uninstall and redeploy' --results $env:RESULTS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write the step summary
        if: ${{ !cancelled() }}
        run: |
          $manifest = Join-Path $env:USERPROFILE '.claude\skills\.deploy-manifest.json'
          # Not hidden, because the artifact upload leaves hidden files out.
          if (Test-Path -LiteralPath $manifest) { Copy-Item -LiteralPath $manifest -Destination (Join-Path $env:LOGS 'deploy-manifest.json') }
          $notes = @()
          if (Test-Path -LiteralPath $env:NOTES) {
            $notes = Get-Content -LiteralPath $env:NOTES | ForEach-Object { '--note'; $_ }
          }
          python tools/deployable_report.py summary --results $env:RESULTS @notes

      - name: Upload the run record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployable-run-${{ matrix.runtimes }}
          path: ${{ runner.temp }}/deployable-logs
          if-no-files-found: warn

  # The same run on a fresh GitHub-hosted Ubuntu runner, in Bash with the commands docs/installation.md lists for
  # Debian and Ubuntu, deploying into the runner's HOME, where every runtime reads skills on Linux. It has no Codex
  # settings step, because those settings exist only on Windows.
  deployable-linux:
    name: Deploy to a fresh Linux profile (${{ matrix.runtimes }} runtimes)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # A dispatch runs the versions it was given. A scheduled run has no inputs, so it runs the README's versions,
        # the inputs' defaults, and beside them the latest release of every runtime.
        runtimes: ${{ github.event_name == 'schedule' && fromJSON('["readme", "latest"]') || fromJSON('["requested"]') }}
    env:
      CLAUDE_VERSION: ${{ matrix.runtimes == 'latest' && 'latest' || inputs.claude-version || '2.1.302' }}
      CODEX_VERSION: ${{ matrix.runtimes == 'latest' && 'latest' || inputs.codex-version || '0.163.0' }}
      COPILOT_VERSION: ${{ matrix.runtimes == 'latest' && 'latest' || inputs.copilot-version || '1.0.98' }}
      # Copilot CLI otherwise runs the newest package it has downloaded, not the one installed and checked here.
      COPILOT_AUTO_UPDATE: 'false'
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare the run record
        run: |
          logs="$RUNNER_TEMP/deployable-logs"
          mkdir -p "$logs"
          {
            echo "LOGS=$logs"
            echo "RESULTS=$logs/results.json"
          } >> "$GITHUB_ENV"

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The floor in deployer/tools.py.
          python-version: '3.11'

      # Copilot CLI needs Node.js 22 or newer.
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # The install commands are the ones docs/installation.md lists. The runner image already provides some of these
      # tools, so each is installed only when it is missing; the verify step below records what was found.
      - name: Install the prerequisites
        run: |
          for command in git shellcheck; do
            if command -v "$command" > /dev/null; then
              echo "$command is provided by the runner image"
            else
              sudo apt-get update
              sudo apt-get install --yes "$command"
            fi
          done
          if command -v pwsh > /dev/null; then
            echo "pwsh is provided by the runner image"
          else
            sudo snap install powershell --classic
          fi
          if ! command -v gh > /dev/null; then
            echo "::error::gh is missing; install it from GitHub's package repository, as docs/installation.md says"
            exit 1
          fi

      - name: Install Claude Code, Codex CLI, and GitHub Copilot CLI
        run: |
          npm install --global "@anthropic-ai/claude-code@$CLAUDE_VERSION" "@openai/codex@$CODEX_VERSION" "@github/copilot@$COPILOT_VERSION"
          # Later steps start with the PATH the runner had, so hand them npm's global directory.
          echo "$(npm prefix --global)/bin" >> "$GITHUB_PATH"

      # A new step is a new shell with the PATH a person would see after opening a terminal.
      - name: Verify the tools in a fresh shell
        run: |
          for command in python3 git pwsh shellcheck gh node npm claude codex copilot; do
            if ! resolved="$(command -v "$command")"; then
              echo "::error::$command is not on PATH"
              exit 1
            fi
            echo "$command -> $resolved"
          done
          for pin in "claude $CLAUDE_VERSION" "codex $CODEX_VERSION" "copilot $COPILOT_VERSION"; do
            command="${pin%% *}"
            wanted="${pin#* }"
            reported="$("$command" --version)"
            echo "$command --version: $reported"
            if [ "$wanted" != latest ] && [[ "$reported" != *"$wanted"* ]]; then
              echo "::error::$command reports '$reported', not the requested version $wanted"
              exit 1
            fi
          done

      - name: Check the deployer's prerequisites
        run: |
          python3 deploy.py check 2>&1 | tee "$LOGS/check.log"

      # configure reads its answers from stdin, so piping them exercises the prompts a person uses: the repositories
      # directory, then an empty line for each later prompt, which keeps its default. Validation holds the answers to
      # the prompts deployer/config.py declares.
      - name: Configure
        run: |
          repositories="$HOME/GitHub"
          mkdir -p "$repositories"
          printf '%s\n' "$repositories" '' '' '' | python3 deploy.py configure 2>&1 | tee "$LOGS/configure.log"

      - name: Deploy (dry run, then for real)
        run: |
          python3 deploy.py --all --dry-run 2>&1 | tee "$LOGS/dry-run.log"
          python3 deploy.py --all 2>&1 | tee "$LOGS/deploy.log"

      # The step runs with pipefail and errexit, so the verify's status is kept for its report rather than ending it.
      - name: Verify discovery after the first deployment
        run: |
          deploy_verify=0
          python3 deploy.py verify 2>&1 | tee "$LOGS/verify-first.log" || deploy_verify=$?
          python3 tools/deployable_report.py verify --label 'first deploy' --deploy-verify-exit "$deploy_verify" --deploy-verify-log "$LOGS/verify-first.log" --results "$RESULTS"

      # Claude Code has no skill listing and no adapter, so check its files instead; no session is started.
      - name: Check the Claude Code file layout after the first deployment
        run: |
          python3 tools/deployable_report.py layout --label 'first deploy' --results "$RESULTS"

      # The README's uninstall, which selects nothing and shows no prompt.
      - name: Uninstall
        run: |
          python3 deploy.py --uninstall --dry-run 2>&1 | tee "$LOGS/uninstall-dry-run.log"
          python3 deploy.py --uninstall 2>&1 | tee "$LOGS/uninstall.log"

      # Names each entry left where items deploy, files included, and each item the manifest still records, beside the
      # manifest and retained backups the uninstall keeps; the step summary lists them.
      - name: Confirm the profile holds nothing from the suite
        run: |
          python3 tools/deployable_report.py leftovers --results "$RESULTS"

      - name: Deploy again
        run: |
          python3 deploy.py --all 2>&1 | tee "$LOGS/redeploy.log"

      - name: Verify discovery after the second deployment
        run: |
          deploy_verify=0
          python3 deploy.py verify 2>&1 | tee "$LOGS/verify-second.log" || deploy_verify=$?
          python3 tools/deployable_report.py verify --label 'after uninstall and redeploy' --deploy-verify-exit "$deploy_verify" --deploy-verify-log "$LOGS/verify-second.log" --results "$RESULTS"

      - name: Check the Claude Code file layout after the second deployment
        run: |
          python3 tools/deployable_report.py layout --label 'after uninstall and redeploy' --results "$RESULTS"

      - name: Write the step summary
        if: ${{ !cancelled() }}
        run: |
          manifest="$HOME/.claude/skills/.deploy-manifest.json"
          # Not hidden, because the artifact upload leaves hidden files out.
          if [ -f "$manifest" ]; then cp "$manifest" "$LOGS/deploy-manifest.json"; fi
          python3 tools/deployable_report.py summary --results "$RESULTS"

      - name: Upload the run record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployable-run-linux-${{ matrix.runtimes }}
          path: ${{ runner.temp }}/deployable-logs
          if-no-files-found: warn
