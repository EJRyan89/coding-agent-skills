name: Runtime Changelogs

# An advisory watch, never a gate: it runs weekly, the day after runtime-command-lines.yml, and on dispatch. It runs
# tools/runtime_changelogs.py, which reads the changelogs of Claude Code, Codex CLI, and GitHub Copilot CLI since the
# release the guidance record names for each, keeps the entries that mention a flag, environment variable, path, or
# frontmatter key the repository's code uses, and requests every page of the guidance record, listing each one that
# moved or is gone. The findings go to the step summary for the maintainer and the next guidance audit to start from.
# A finding never fails the job; only a watch that cannot run does. It starts no model, installs no runtime, and needs
# no secret and no sign-in. Its one command is given the job's own read-only token, as GH_TOKEN, which the watch sends
# to api.github.com alone and never on to a redirect: read unauthenticated, the Codex releases API shares a hosted
# runner's address limit with every other job on it, which failed weekly runs.

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 4'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changelogs:
    name: Runtime changelogs and guidance pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step needs git's credential, so the checkout stores none for them to read.
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The floor in deployer/tools.py.
          python-version: '3.12'

      - name: Watch the changelogs and the guidance pages
        env:
          # The watch reads the token from here and sends it to api.github.com alone; this step's command is the only
          # one of the job given it.
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/runtime_changelogs.py --summary "$GITHUB_STEP_SUMMARY"
