# Tool configuration for contributors and CI. Nothing here is installed, so there is no [project] table;
# requirements-dev.txt pins the tools and docs/dependency-updates.md owns the decision.

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# Validation runs `ruff check` with these rule sets on the same roots it formats, and no rule or file is exempt.
# E501 stays on: the formatter wraps code, and a string, comment, or docstring it cannot wrap is split by hand.
# A finding that must stay is suppressed on its line as `# noqa: <code> - <reason>`, which validation requires.
# The complexity rules (PLR, C90) are #91's.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

# Validation runs mypy once per root: deployer/, tools/, deploy.py, and tests/ together from the repository root, and
# each skill's scripts/ directory from inside it. Default strictness; no module or import is exempt.
[tool.mypy]
python_version = "3.11"
# The deployer and the skills support Windows only, so mypy checks them as Windows sees them on any host. Revisit
# when deployer/platform_support.py gains another platform.
platform = "win32"
# tests/ imports tools/skill_reference.py both as tools.skill_reference and by path; module names follow the paths.
explicit_package_bases = true
# Each skills/<name>/scripts directory a module puts on sys.path: the code-review-core scripts its skill_deps
# dependents import, and the analyze-skill-cost inventory tools/new_skill.py and the validation runner import. Their
# imports then resolve as they do at run time. Validation keeps this list equal to those sys.path entries.
mypy_path = [
    "$MYPY_CONFIG_FILE_DIR/skills/analyze-skill-cost/scripts",
    "$MYPY_CONFIG_FILE_DIR/skills/code-review-core/scripts",
]
# Regression suites (test_*.py) and the runtime-canary fixture tree are excluded in #92's first pass; its second pass
# removes this exclusion and fixes the suites.
exclude = '(^|/)test_[^/]*\.py$|^tests/fixtures/'
