# Tool configuration for contributors and CI. Nothing here is installed, so there is no [project] table;
# requirements-dev.txt pins the tools and docs/dependency-updates.md owns the decision.

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# Validation runs `ruff check` with these rule sets on the same roots it formats. E501 stays on: the formatter
# wraps code, and a string, comment, or docstring it cannot wrap is split by hand. The complexity rules (PLR, C90)
# are #91's.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

# mypy is pinned in requirements-dev.txt but not yet run; #92 adds its configuration and the validation gate.
[tool.mypy]
