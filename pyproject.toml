# Tool configuration for contributors and CI. Nothing here is installed, so there is no [project] table;
# requirements-dev.txt pins the tools and docs/dependency-updates.md owns the decision.

# Validation starts each Python regression suite, or each shard of a large one, as `python -B -m pytest <suite>` from
# this root, which conftest.py beside this file sets up. The cache plugin is off, so a run writes nothing into the
# checkout; output is not captured, so a suite's own output and its subprocesses' reach the runner as they did under
# unittest; and strict mode turns on every strictness option pytest has, `strict_config`, `strict_markers`,
# `strict_parametrization_ids`, and `strict_xfail`, so a misspelled marker or option, a duplicate parametrization id,
# and an expected failure that passes are errors, and it turns on each option a later pytest adds. Nothing here
# selects, deselects, or skips a test, which tests/validation/suite_discovery.py holds by pinning this table.
[tool.pytest.ini_options]
addopts = ["-p", "no:cacheprovider", "--capture=no"]
strict = true

[tool.ruff]
# Empty, so ruff's default exclusions, such as dist/, venv/, site-packages/, node_modules/, and _build/, skip no file
# under the roots validation names; a gitignored file is still skipped, since nothing can commit one.
exclude = []
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# Validation runs `ruff check` with these rule sets on the same roots it formats, and no rule or file is exempt but
# S101 in the regression suites, under per-file-ignores below.
# E501 stays on: the formatter wraps code, and a string, comment, or docstring it cannot wrap is split by hand.
# A finding that must stay is suppressed on its line as `# noqa: <code> - <reason>`, which validation requires.
# C901, PLR0915, and PLR0913 cap a function's complexity, length, and arguments at the ceilings below, and C901 and
# PLR0915 take no noqa. BLE001 refuses a blind except, and each one kept carries a noqa naming it, whose number is held
# too. These are ratchets: tests/validation/python_checks.py refuses a raised ceiling and a noqa past the count.
# The S prefixes select every stable bandit rule except S603 (a subprocess call without a shell) and S607 (a program
# started by its PATH name); the S4 import rules are preview-only, which this configuration does not enable. Every
# subprocess call here runs a declared tool as an argument list found on PATH, which skill_command_problems, the tools
# catalogue in deployer/tools.py, and the shell-token policy already hold, so those two would flag the design itself on
# every call. Leaving them unselected exempts no finding of a selected rule.
# The PT prefixes select every stable flake8-pytest-style rule except PT009 (a unittest assertion method) and PT027
# (unittest's assertRaises); ruff has removed PT004 and PT005, and PT029 is preview-only. A suite stays a set of
# unittest test cases where rewriting it buys nothing, and a test case checks with its own assertion methods, so those
# two would flag every check such a class makes. A test function and its helpers assert, which S101's exemption below
# and the suite-shape policy's refusal of a module-level TestCase hold instead.
# RET, PIE, C4, PERF, and A select every stable rule of the return, idiom, comprehension, performance, and builtins
# families: a value is returned without a throwaway name, a list a loop only appends to is a comprehension or an
# extend, a dictionary of one value is dict.fromkeys, and no name shadows a builtin.
[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "C901",
    "PLR0915",
    "PLR0913",
    "BLE001",
    "PTH",
    "RUF",
    "S1",
    "S2",
    "S3",
    "S5",
    "S601",
    "S602",
    "S604",
    "S605",
    "S606",
    "S608",
    "S609",
    "S61",
    "S7",
    "PT001",
    "PT002",
    "PT003",
    "PT006",
    "PT007",
    "PT008",
    "PT01",
    "PT020",
    "PT021",
    "PT022",
    "PT023",
    "PT024",
    "PT025",
    "PT026",
    "PT028",
    "PT03",
    "RET",
    "PIE",
    "C4",
    "PERF",
    "A",
]

# S101 refuses a bare `assert` because `python -O` strips it, which never happens to a regression suite: validation
# starts every suite as `python -B -m pytest`, whose assertion rewriting shows both sides of a failed `assert`. So S101
# is off for tests/ and each skill's scripts/test_*.py suite, none of which a deployment ships, and stays on for every
# module a deployment runs; tests/validation/python_checks.py pins these paths and that one rule.
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"skills/*/scripts/test_*.py" = ["S101"]
".claude/skills/*/scripts/test_*.py" = ["S101"]

# A ratchet: the most complex function's score, lowered as each split lands. The number only goes down, never up.
[tool.ruff.lint.mccabe]
max-complexity = 15

# Ratchets: the longest function's statement count and the most arguments a function takes, each lowered as the
# change that shortens the longest lands. Each only goes down, never up.
[tool.ruff.lint.pylint]
max-args = 17
max-statements = 50

# Validation runs mypy once per root: deployer/, tools/, deploy.py, tests/, and conftest.py together from the
# repository root, and
# each skill's scripts/ directory from inside it. Default strictness; no module, suite, or import is exempt.
[tool.mypy]
python_version = "3.11"
# The optional error codes beyond --strict that every root passes, so a name a path leaves unbound, a condition that is
# always true, a match that leaves a case unhandled, and a `type: ignore` without its codes are errors. warn_unreachable
# and mutable-override are declined; "Considered and declined" in docs/design.md says why.
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable",
]
# No platform is set, so mypy checks each module as the host running validation sees it: a Windows leg checks the
# Windows branches and a Linux one the others, and code for the other platform carries its `type: ignore` reason.
# tests/ imports tools/skill_reference.py both as tools.skill_reference and by path; module names follow the paths, and
# a module in a mypy_path directory below is named by its bare name, as the code that puts it on sys.path imports it.
explicit_package_bases = true
# Each skills/<name>/scripts directory a module or suite puts on sys.path: the ejryan89-code-review-core and ejryan89-skill-core scripts
# their skill_deps dependents import, ejryan89-skill-core's also imported by the deployer, tools/, and tests, the
# audit-skill inventory tools/new_skill.py and the validation runner import, the review-document and
# review-insights scripts tools/runtime_prompts.py imports, the review-document scripts the skill-evals suite imports,
# the review-insights and update-pr-dashboard scripts the format-contract suite imports, the update-pr-dashboard
# scripts an ejryan89-code-review-core suite imports, the dotnet-format scripts the check suite imports, and the
# audit-ai-config, curate-agent-memory, dotnet-dependencies, github-activity-report, and repo-cleanup scripts the
# malformed-input reader tables import beside the others. Then
# tests/deployer, whose suites import harness from beside them, tests/malformed_input, whose suite and reader tables
# import the corpus and one another from beside them, tests/tools, whose hub guard and worktrees suites
# import worktree_fixture from beside them, and tests/validation, whose policy modules and their suites import one
# another by bare name, as tests/run_validation.py does. Their imports then resolve as they do at run time. Validation
# keeps this list equal to those directories.
mypy_path = [
    "$MYPY_CONFIG_FILE_DIR/skills/audit-ai-config/scripts",
    "$MYPY_CONFIG_FILE_DIR/skills/audit-skill/scripts",
    "$MYPY_CONFIG_FILE_DIR/skills/curate-agent-memory/scripts",
    "$MYPY_CONFIG_FILE_DIR/skills/dotnet-dependencies/scripts",
    "$MYPY_CONFIG_FILE_DIR/skills/ejryan89-code-review-core/scripts",
    "$MYPY_CONFIG_FILE_DIR/skills/dotnet-format/scripts",
    "$MYPY_CONFIG_FILE_DIR/skills/github-activity-report/scripts",
    "$MYPY_CONFIG_FILE_DIR/skills/repo-cleanup/scripts",
    "$MYPY_CONFIG_FILE_DIR/skills/review-document/scripts",
    "$MYPY_CONFIG_FILE_DIR/skills/review-insights/scripts",
    "$MYPY_CONFIG_FILE_DIR/skills/ejryan89-skill-core/scripts",
    "$MYPY_CONFIG_FILE_DIR/skills/update-pr-dashboard/scripts",
    "$MYPY_CONFIG_FILE_DIR/tests/deployer",
    "$MYPY_CONFIG_FILE_DIR/tests/malformed_input",
    "$MYPY_CONFIG_FILE_DIR/tests/tools",
    "$MYPY_CONFIG_FILE_DIR/tests/validation",
]

# The areas mypy checks in strict mode, as paths from this root: a skill's scripts directory, which
# tests/run_validation.py type-checks in a run of its own, or a root it type-checks with the others from this root,
# which then also gets a run of its own. mypy takes strict for a whole run, never for one module, so the runner reads
# this list and adds --strict to each listed area's own run, with the [tool.mypy] configuration above. Every root is
# listed and none leaves: tests/validation/python_checks.py fails when a root, or an area it pins, is missing here.
[tool.validation]
mypy-strict = [
    "skills/ejryan89-skill-core/scripts",
    "deployer",
    "deploy.py",
    "tools",
    "tests",
    "conftest.py",
    "skills/audit-ai-config/scripts",
    "skills/audit-skill/scripts",
    "skills/curate-agent-memory/scripts",
    "skills/dotnet-dependencies/scripts",
    "skills/dotnet-format/scripts",
    "skills/ejryan89-code-review-core/scripts",
    "skills/flag-review-finding/scripts",
    "skills/github-activity-report/scripts",
    "skills/repo-cleanup/scripts",
    "skills/review-document/scripts",
    "skills/review-insights/scripts",
    "skills/update-pr-dashboard/scripts",
    ".claude/skills/audit-repository/scripts",
    ".claude/skills/change-skill/scripts",
    ".claude/skills/implement-change/scripts",
    ".claude/skills/review-repository/scripts",
    ".claude/skills/shepherd-pull-requests/scripts",
]

# mutmut reads its configuration from the working directory; tools/mutation_gate.py makes its mutants from this root
# and chooses the modules itself, so this names only where they may come from.
[tool.mutmut]
source_paths = ["deployer", "tools", "skills", ".claude/skills"]
