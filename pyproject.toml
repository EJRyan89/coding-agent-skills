# Tool configuration for contributors and CI. Nothing here is installed, so there is no [project] table;
# requirements-dev.txt pins the tools and docs/dependency-updates.md owns the decision.

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# Validation runs `ruff check` with these rule sets on the same roots it formats, and no rule or file is exempt.
# E501 stays on: the formatter wraps code, and a string, comment, or docstring it cannot wrap is split by hand.
# A finding that must stay is suppressed on its line as `# noqa: <code> - <reason>`, which validation requires.
# C901 and PLR0915 cap function complexity and length at the ceilings below (#91), with no noqa for either;
# tests/run_validation.py refuses a raised ceiling.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C901", "PLR0915"]

# #91's ratchet: the most complex function's score when landed. The number only goes down, never up.
[tool.ruff.lint.mccabe]
max-complexity = 51

# #91's ratchet: the longest function's statement count when landed. The number only goes down, never up.
[tool.ruff.lint.pylint]
max-statements = 148

# mypy is pinned in requirements-dev.txt but not yet run; #92 adds its configuration and the validation gate.
[tool.mypy]
